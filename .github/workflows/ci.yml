name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  inventory-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_db
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IT_POSTGRES_URL: jdbc:postgresql://localhost:5432/inventory_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Unit and integration tests (real PostgreSQL)
        working-directory: inventory-service
        run: mvn -B verify
      - name: Report executed tests
        if: always()
        working-directory: inventory-service
        run: |
          for f in target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml; do
            [ -f "$f" ] && echo "$(basename "$f" .xml | sed 's/^TEST-//') $(grep -o -m1 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f")"
          done > test-summary.txt
          echo "::notice title=inventory-service tests::$(tr '\n' ';' < test-summary.txt)"

  order-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: order_db
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orders" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IT_POSTGRES_URL: jdbc:postgresql://localhost:5432/order_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Unit and integration tests (real PostgreSQL)
        working-directory: order-service
        run: mvn -B verify
      - name: Report executed tests
        if: always()
        working-directory: order-service
        run: |
          for f in target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml; do
            [ -f "$f" ] && echo "$(basename "$f" .xml | sed 's/^TEST-//') $(grep -o -m1 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' "$f")"
          done > test-summary.txt
          echo "::notice title=order-service tests::$(tr '\n' ';' < test-summary.txt)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  system-tests:
    # Black-box tests against the real stack: docker-compose brings up both services, both
    # PostgreSQL databases and the gateway; then Rest Assured/TestNG API tests, the oversell
    # race script and a JMeter load test run against it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API tests (Rest Assured + TestNG)
        working-directory: api-tests
        run: mvn -B test
      - name: Report executed API tests
        if: always()
        working-directory: api-tests
        run: |
          f=target/surefire-reports/testng-results.xml
          if [ -f "$f" ]; then echo "::notice title=api-tests::$(grep -o -m1 '<testng-results[^>]*' "$f" | tr -s ' ' | tr '\n' ' ')"; fi
      - name: List failed API tests
        if: failure()
        working-directory: api-tests
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("target/surefire-reports/testng-results.xml"):
              for m in ET.parse(f).getroot().iter("test-method"):
                  if m.get("status") == "FAIL":
                      msg = (m.findtext("exception/message") or "").strip().replace("\n", " | ")[:700]
                      print(f"::notice title=FAIL {m.get('name')}::{msg}")
          PY
      - name: Oversell race (15 concurrent orders for the last unit)
        run: bash scripts/e2e-oversell.sh http://localhost:8088 15
      - name: Install JMeter
        run: |
          curl -fsSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
          tar -xzf jmeter.tgz
      - name: Load test (JMeter)
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n -t perf/orderflow-load.jmx -l results.jtl -e -o jmeter-report \
            -Jthreads=20 -Jramp=10 -Jduration=40 -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.timestamp_format=ms
      - name: Enforce load-test limits
        run: python3 perf/check_results.py results.jtl --max-error-rate 0.01 --max-p95-ms 2000 --min-samples 200 | tee perf-summary.txt
      - name: Surface load-test summary
        if: always()
        run: |
          if [ -f perf-summary.txt ]; then echo "::notice title=jmeter::$(tr '\n' ';' < perf-summary.txt)"; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: |
            jmeter-report
            results.jtl
            api-tests/target/surefire-reports
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 120
