server:
  port: 8081

spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USER:inventory}
    password: ${INVENTORY_DB_PASSWORD:inventory}
    hikari:
      pool-name: inventory-pool
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration

inventory:
  reservation:
    # How long a CONFIRMED (but not yet committed) hold survives before the sweeper releases it.
    ttl: PT15M
    sweep-interval: PT1M
    sweep-enabled: true
    # Bounded retry for the optimistic-locked restock/adjust path.
    adjust-max-retries: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.orderflow.inventory: DEBUG
