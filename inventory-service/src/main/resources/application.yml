server:
  # Render (and most PaaS) inject the port to bind as $PORT.
  port: ${PORT:8081}

spring:
  application:
    name: inventory-service
  datasource:
    # A full INVENTORY_DB_URL wins (docker-compose sets it directly). Otherwise the URL is
    # assembled from discrete parts, which is what a managed-Postgres provider hands you.
    url: ${INVENTORY_DB_URL:jdbc:postgresql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:5432}/${INVENTORY_DB_NAME:inventory_db}?sslmode=${INVENTORY_DB_SSLMODE:prefer}}
    username: ${INVENTORY_DB_USER:inventory}
    password: ${INVENTORY_DB_PASSWORD:inventory}
    hikari:
      pool-name: inventory-pool
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration

inventory:
  reservation:
    # How long a CONFIRMED (but not yet committed) hold survives before the sweeper releases it.
    ttl: PT15M
    sweep-interval: PT1M
    sweep-enabled: true
    # Bounded retry for the optimistic-locked restock/adjust path.
    adjust-max-retries: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.orderflow.inventory: DEBUG
