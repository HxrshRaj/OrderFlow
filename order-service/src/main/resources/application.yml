server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:orders}
    password: ${ORDER_DB_PASSWORD:orders}
    hikari:
      pool-name: order-pool
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
  connect-timeout: 500ms
  read-timeout: 2s

order:
  reconciler:
    # Retry inventory reservation for orders stuck in PLACED for longer than this.
    stale-after: PT10S
    interval: PT15S
    enabled: true

resilience4j:
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.orderflow.order.client.InventoryUnavailableException
        ignore-exceptions:
          - com.orderflow.order.client.InsufficientStockException
  circuitbreaker:
    instances:
      inventory:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.orderflow.order.client.InsufficientStockException

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    com.orderflow.order: DEBUG
