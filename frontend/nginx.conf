server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single origin for the browser: static SPA here, both services proxied under /api/*.
    # This is the whole reason for a gateway container - it keeps CORS out of the picture.

    location /api/inventory/ {
        proxy_pass http://inventory-service:8081/api/v1/inventory/;
        proxy_set_header Host $host;
    }

    location = /api/inventory {
        proxy_pass http://inventory-service:8081/api/v1/inventory;
        proxy_set_header Host $host;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8080/api/v1/orders/;
        proxy_set_header Host $host;
    }

    location = /api/orders {
        proxy_pass http://order-service:8080/api/v1/orders;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
